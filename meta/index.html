<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Meta Analysis</title>
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../global.js"></script>
  <script type="module" src="main.js"></script>
</head>

<body>

  <h1>Meta</h1>
  <p>The following is some meta data in regards to my GitHub profile:</p>

  <div id="stats"></div>

  <div id="scrolly-1">

    <div id="scatter-story">
      <div class="step">Some filler text here</div>
      <div class="step">More text will go here later</div>
      <div class="step">Eventually these steps will control the plot</div>
    </div>

    <div id="scatter-plot">

      <h2>Commits by time of day</h2>

      <div id="chart"></div>

      <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd><a href="" id="commit-link" target="_blank"></a></dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-time"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
      </dl>

      <p id="selection-count">No commits selected</p>

      <dl id="language-breakdown" class="stats"></dl>

      <div id="time-filter">
        <label for="commit-progress">
          Show commits until:
          <time id="slider-time"></time>
        </label>

        <input id="commit-progress" type="range" min="0" max="100" value="100" />
      </div>


    </div>

  </div>

  <dl id="files"></dl>

</body>

</html>
